<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-50 text-stone-800 antialiased font-sans min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="border-b border-stone-200 bg-white/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="{{ '/' | relative_url }}"
                class="font-medium tracking-tight text-stone-900 hover:text-stone-600 transition-colors">
                The Triveni Yoga
            </a>
            <nav class="flex items-center gap-6 text-sm text-stone-600">
                <a href="{{ '/' | relative_url }}" class="hover:text-stone-900 transition-colors">Home</a>
                <a href="{{ '/' | relative_url }}#journal" class="hover:text-stone-900 transition-colors">Journal</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-3xl mx-auto px-6 py-12 w-full">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="border-t border-stone-200 bg-white py-8 text-stone-500 text-sm">
        <div class="max-w-3xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>© {{ site.time | date: "%Y" }} The Triveni Yoga. Exploring Karma, Gyan, and Bhakti in daily life.</p>
            <!-- Social Media Links -->
            <div class="flex items-center gap-5 text-xs font-medium uppercase tracking-wider text-stone-600">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"
                    class="hover:text-stone-950 transition-colors">Instagram</a>
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer"
                    class="hover:text-stone-950 transition-colors">Facebook</a>
                <a href="https://youtube.com" target="_blank" rel="noopener noreferrer"
                    class="hover:text-stone-950 transition-colors">YouTube</a>
            </div>
        </div>
    </footer>

</body>

</html>
